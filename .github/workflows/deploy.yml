
name: Deploy Blog Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: blog-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Diagnose OIDC identity
        run: |
          TOKEN=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          TOKEN_PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          TOKEN_PAYLOAD="$TOKEN_PAYLOAD" python3 -c '
          import os, json, base64
          s = os.environ["TOKEN_PAYLOAD"]
          data = json.loads(base64.urlsafe_b64decode(
              s + "=" * (-len(s) % 4)
          ))
          print(json.dumps({
              k: data.get(k)
              for k in ("iss", "aud", "sub", "repository", "ref")
          }, indent=2))
          '

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload versioned assets to S3
        run: |
          aws s3 sync dist/assets/ \
            "s3://${{ vars.S3_BUCKET }}/assets/" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload remaining frontend files
        run: |
          aws s3 sync dist/ \
            "s3://${{ vars.S3_BUCKET }}/" \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
